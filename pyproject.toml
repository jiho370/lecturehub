[project]
name = "lecturehub"
dynamic = ["version"]  # the one place: __version__ in src/lecturehub/__init__.py
description = "Lecture Hub - lecture capture, transcription and study hub (Windows-first)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "python-ulid>=2",
    "keyring>=25",
]

[project.optional-dependencies]
# 트랙별 의존성. 자기 트랙 그룹에만 추가한다(충돌 방지).
recorder = [
    "numpy>=1.26",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]
transcribe = [
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",  # D-054: Pacific-time quota day on Windows
    "truststore>=0.10",  # HTTPS verified against the Windows certificate store (school/company networks)
    "google-cloud-speech>=2.26",  # live captions: Chirp 3 confirmed lines (gcloud login)
    "websockets>=13",  # live captions: Gemini Live quick line
]
whisper = [
    "faster-whisper>=1.0.3",
]
materials = [
    "pypdfium2>=4.30",  # PDF text and page images (BSD/Apache); replaces PyMuPDF (AGPL)
    "pillow>=10",
    "python-pptx>=1.0",
    "olefile>=0.47",  # HWP 5 text for the assignment helper
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pywebview>=5",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pymupdf>=1.24",  # tests and tools only: builds synthetic PDFs (AGPL, never shipped)
]
build = [
    "pyinstaller>=6.10,<7",  # tools/build_app.py (the installed app); not needed to run from source
]

[project.scripts]
lecturehub = "lecturehub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lecturehub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lecturehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
tmp_path_retention_policy = "failed"  # keep tmp dirs only for failed tests (pytest >= 7.3; disk review 2026-11-09)

[tool.ruff]
line-length = 110
