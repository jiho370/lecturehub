# Builds the installable app on a clean Windows machine and proves it starts there:
# public export → PyInstaller → self-check of the built exe (worker and hidden window) → installer →
# silent install, self-check of the installed copy, silent uninstall → SHA-256 → artifacts.
# A build that fails any step is not released.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exactly the locked packages (version and SHA-256), then the app itself
        run: |
          python -m pip install --require-hashes -r requirements/release.txt
          python -m pip install --no-deps -e .

      - name: Inno Setup (pinned)
        shell: pwsh
        run: |
          $setup = python tools/fetch_tools.py innosetup --cache "$env:RUNNER_TEMP\tools"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = "$env:RUNNER_TEMP\innosetup"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          Add-Content $env:GITHUB_ENV "LECTUREHUB_ISCC=$dir\ISCC.exe"

      - name: Build (public export, exe, zip, installer)
        shell: pwsh
        run: python tools/build_app.py --out "$env:RUNNER_TEMP\build" --installer --cache "$env:RUNNER_TEMP\tools"

      - name: Self-check of the built app (worker)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\build\dist\LectureHub\LectureHubWorker.exe" selfcheck --out "$env:RUNNER_TEMP\build\selfcheck-worker.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-check of the built app (hidden window)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\build\dist\LectureHub\LectureHub.exe" -ArgumentList "--smoke","--out","$env:RUNNER_TEMP\build\selfcheck-app.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\build\selfcheck-app.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "LectureHub.exe --smoke failed ($($p.ExitCode))"; exit 1 }

      - name: Install silently, check the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\build\LectureHub-*-setup.exe" | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\installed"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "setup failed ($($p.ExitCode))"; exit 1 }
          & "$dir\LectureHubWorker.exe" selfcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "uninstall failed ($($u.ExitCode))"; exit 1 }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\LectureHub.exe") { Write-Error "uninstall left the program behind"; exit 1 }

      - name: Microsoft Store package (MSIX), installed and checked on this runner
        # A test identity is signed with a throw-away certificate that only this runner trusts, installed, and run
        # inside the package (window self-check + worker self-check). The upload copy uses the Partner Center
        # identity from the repository variables and stays unsigned: the Store signs it after certification.
        shell: pwsh
        env:
          STORE_NAME: ${{ vars.MSIX_NAME }}
          STORE_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $app = "$env:RUNNER_TEMP\build\dist\LectureHub"
          $test = "$env:RUNNER_TEMP\msix-test"
          python tools/build_msix.py --app $app --out $test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $msix = Get-ChildItem "$test\*.msix" | Select-Object -First 1
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=LectureHubTest" -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $plain = [guid]::NewGuid().ToString()  # throw-away: the certificate dies with this runner
          Export-PfxCertificate -Cert $cert -FilePath "$test\test.pfx" -Password (ConvertTo-SecureString $plain -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$test\test.cer" | Out-Null
          Import-Certificate -FilePath "$test\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $kit.FullName sign /fd SHA256 /f "$test\test.pfx" /p $plain $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-AppxPackage -Path $msix.FullName
          $pkg = Get-AppxPackage -Name "LectureHub.Test"
          if (-not $pkg) { Write-Error "the MSIX did not install"; exit 1 }
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          # the window has no alias (one per Application, kept for the worker): start it inside the package
          $smoke = "$env:RUNNER_TEMP\build\selfcheck-msix-app.json"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId "LectureHub" `
            -Command "$($pkg.InstallLocation)\LectureHub.exe" -Args "--smoke --out `"$smoke`""
          $deadline = (Get-Date).AddMinutes(5)
          Start-Sleep -Seconds 5
          while ((Get-Process -Name LectureHub -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Get-Content $smoke -ErrorAction SilentlyContinue
          $result = Get-Content $smoke -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          if (-not $result.ok) { Write-Error "packaged LectureHub.exe --smoke failed"; exit 1 }
          & "$alias\LectureHubWorker.exe" selfcheck --out "$env:RUNNER_TEMP\build\selfcheck-msix-worker.json"
          if ($LASTEXITCODE -ne 0) { Write-Error "packaged worker self-check failed"; exit 1 }
          $cache = "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalCache"
          if (-not (Test-Path $cache)) { Write-Error "the app did not run inside its package (no $cache)"; exit 1 }
          Get-ChildItem $cache -Recurse -Directory -Depth 2 | Select-Object -ExpandProperty FullName
          Remove-AppxPackage -Package $pkg.PackageFullName
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\store" | Out-Null
          if ($env:STORE_NAME -and $env:STORE_PUBLISHER -and $env:STORE_PUBLISHER_DISPLAY) {
            python tools/build_msix.py --app $app --out "$env:RUNNER_TEMP\store" --name $env:STORE_NAME `
              --publisher $env:STORE_PUBLISHER --publisher-display-name $env:STORE_PUBLISHER_DISPLAY
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            "No Partner Center identity in the repository variables (MSIX_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY): upload copy not made." | Tee-Object "$env:RUNNER_TEMP\store\README.txt"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LectureHub-store
          path: ${{ runner.temp }}/store/
          retention-days: 14

      - name: SHA-256 of what would be released
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\build\LectureHub-*" -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Tee-Object "$env:RUNNER_TEMP\build\SHA256SUMS.txt"

      # Code signing goes here once a certificate exists (SignPath Foundation, after the public repository is up).

      - uses: actions/upload-artifact@v4
        with:
          name: LectureHub-build
          path: |
            ${{ runner.temp }}/build/LectureHub-*
            ${{ runner.temp }}/build/SHA256SUMS.txt
            ${{ runner.temp }}/build/selfcheck-*.json
          retention-days: 14
